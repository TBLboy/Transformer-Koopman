[project]
name = "tkoop"
version = "0.1.0"
description = "Transformer-Koopman 建模对比与消融实验"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
