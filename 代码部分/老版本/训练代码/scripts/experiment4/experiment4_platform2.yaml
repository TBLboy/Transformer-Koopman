experiment:
  name: "experiment4_platform2"
  seed: 42
  device: "cuda"
  precision: "float64"
  deterministic: true
  cudnn_benchmark: false
  amp: false
  allow_tf32: false
  log_dir: "./results/logs/experiment4/platform2"
  save_dir: "./results/experiment4"

data:
  data_dir: "./data/experiment_006"
  train_file: "train.npz"
  val_file: "val.npz"
  test_file: "test.npz"
  state_dim: 2
  control_dim: 2
  normalize_state: true
  normalize_control: true
  normalization_method: "standard"
  add_noise: false
  noise_level: 0.0
  noise_type: "gaussian"

fixed_training:
  method: "edmd"
  num_workers: 8
  prefetch_factor: 4
  val_every_n_epochs: 5
  save_every_n_epochs: 10
  save_best_only: true
  edmd:
    pretrain:
      enabled: true
      num_epochs: 500
      batch_size: 4096
      learning_rate: 0.0010
      optimizer: "adam"
      early_stopping: true
      patience: 100
      min_delta: 0.00001
      multi_step:
        horizon: 3
    compute:
      regularization: 0.000001
      svd_clipping: false
      batch_encode: false
      batch_size: 4096
    decoder:
      method: "least_squares"
      regularization: 0.000001

fixed_loss_weights:
  prediction: 1.0
  latent: 0.5
  consistency: 0.5
  multi_step_physical: 0.0
  multi_step_latent: 0.0

fixed_model:
  encoder:
    history_length: 4
    patch_length: 2
    latent_dim: 10
    d_model: 16
    n_layers: 3
    n_heads: 2
    d_ff: 64
    dropout: 0.1
    positional_encoding: "sinusoidal"
    readout_method: "mean"
  koopman:
    enforce_stability: false
    rho_max: 0.9999
    model_type: "linear"
  decoder:
    decoder_type: "linear"

selection:
  source_split: "val"
  primary_metric: "val_rollout_rmse"
  tie_breakers: ["val_one_step_rmse", "params"]

scan_space:
  history_length: [2, 4, 6, 8, 12]
  patch_length: [1, 2, 4]
  latent_dim: [6, 8, 10, 16]
  n_layers: [1, 2, 3, 4]
  d_model: [16, 32]
  d_ff: [64, 128]

controller:
  type: "lqr"
  lqr:
    Q_matrix: "identity"
    R_matrix: "identity"
    Q_scale: 1.0
    R_scale: 0.1

evaluation:
  prediction:
    one_step: true
    multi_step: true
    multi_step_horizons: [5, 10, 20]
  tracking:
    enabled: false
    reference_trajectories: ["sine", "circle", "step"]
    tracking_length: 100
  visualization:
    plot_predictions: true
    plot_trajectories: true
    plot_koopman_spectrum: true
    save_format: "png"

logging:
  level: "INFO"
  log_to_file: true
  log_to_console: true
  tensorboard: false
  wandb: false
  log_frequency: 10
