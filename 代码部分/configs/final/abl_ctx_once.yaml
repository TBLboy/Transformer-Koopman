  snapshot_every: 20
  lr: 0.001
  epochs: 100
  alpha: 0.1
stage2:
  batch_size: 128
  weight_decay: 0.0001
  grad_clip: 5.0
  warmup_frac: 0.05
  lr_min_ratio: 0.01
  val_every: 1
  snapshot_every: 20
  trainable: scheduling
  lr: 0.001
  epochs: 100
  alpha: 0.1
dynamics:
  kind: scheduled
  r_A: 3
  r_B: 2
  g_A: 0.1
  g_B: 0.1
