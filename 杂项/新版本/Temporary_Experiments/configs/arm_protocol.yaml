# Frozen protocol for the robotic-arm device (3 joints) -- Temporary_Experiments
#
# Authority chain:
#   1. user directive 2026-10-11: re-run the same experiment on the arm dataset
#   2. reports/data_audit_arm.md   (data audit = the arm's Gate 0)
#   3. DEC-086 (control box) and DEC-087 (device parameterisation)
#   4. configs/modeling_protocol.yaml  (the soft-platform protocol this reuses)
#
# Rule: everything here is frozen before the first arm training run.  Any later
# change must be recorded as an explicit deviation in .project-log.
#
# WHAT IS IDENTICAL TO THE SOFT PLATFORM (so the comparison is a method comparison):
#   the model matrix M0-M6, the controlled-prediction interface, the window rule
#   (P=8 measurements + P-1 past inputs, u_k excluded from the context), the
#   normalisation rule (train-only, per channel), the metrics, the fairness rules,
#   the selection rule (validation multi-step rollout only), and the controller
#   set C0/C1/C2 with identical weights and constraints.
# WHAT IS DEVICE-SPECIFIC (and therefore cannot be compared step-for-step):
#   state/control dims, dt, trajectory length, the prediction horizons in seconds,
#   the MPC horizon N, and the control box.

schema_version: 1
device: arm_3link
frozen_by: TASK-046

data:
  dir: 数据备份/机械臂数据/处理后的数据
  raw: 数据备份/机械臂数据/原始数据/data1..20.mat
  split: {train: 15, val: 4, test: 1}        # trajectories, never windows
  split_rule: "legacy: filenames sorted as strings, cut 15/4/1 (prepare_data.py SPLIT_PLAN)"
  trajectory_length: "4975..4981 (mean 4977); 20 s each"
  sampling_period_s: 0.004                   # 250 Hz
  state: "[q1, dq1, q2, dq2, q3, dq3]  (joint 1..3 position and velocity)"
  control: "[tau1, tau2, tau3]  (joint torques)"
  provenance: "x == raw q elementwise; u == raw tau elementwise (verified, reports/data_audit_arm.md)"
  normalisation:
    fit_on: train_only
    x_mean: [0.097531, -0.015824, 0.673393, 0.001894, 0.224119, -0.001332]
    x_std:  [0.428247, 2.980478, 0.216930, 1.934337, 0.119379, 1.570696]
    u_mean: [0.034564, 3.111360, 1.380698]
    u_std:  [0.918609, 0.918556, 0.546100]
  u_observed_range_train:                    # empirical, per joint
    lower: [-2.638622, -0.207298, -1.178879]
    upper: [3.503677, 5.709922, 2.965935]
  u_observed_range_normalised_train:
    lower: [-2.910036, -3.612909, -4.687015]
    upper: [3.776483, 2.827928, 2.901090]

architecture:
  history_length_P: 8                        # same as legacy configs/platform1.yaml
  patch_length_p: 2
  latent_dim_d: 14                           # n + n_psi with n_psi = 8 (protocol rule preserved)
  state_dim_n: 6
  control_dim_m: 3
  context_input_dim: 69                      # P*n + (P-1)*m = 8*6 + 7*3
  note_on_latent_dim: >-
    The soft platform froze d = 10 for n = 2, i.e. n_psi = d - n = 8.  The rule
    "z = [x_k ; h_k] with 8 learned lifting coordinates" is preserved here, so the
    arm uses d = 6 + 8 = 14.  Freezing the absolute value 10 instead would silently
    reduce the method's capacity relative to its state dimension.
  searched_hyperparameters: [r_A, r_B, g_A, g_B, d_model, n_layers, lr, w_roll, roll_h]
  search_space: configs/search_spaces.yaml   # unchanged from the soft platform

prediction_task:
  one_step: "given the history ending at k and u_k, predict x_{k+1}"
  rollout: "autoregressive open-loop H-step; latent propagation for the scheduled models"
  horizons_steps: {short: 5, mid: 25, long: 100, long2: 500, long3: 1000}
  horizons_seconds: {short: 0.02, mid: 0.1, long: 0.4, long2: 2.0, long3: 4.0}
  why_extra_horizons: >-
    At 250 Hz the protocol's step horizons are only 20/100/400 ms, which says
    nothing about the arm's slow dynamics (dominant 0.2-0.85 Hz, period 1.2-5 s).
    The three protocol horizons are kept for method identity; long2/long3 (2 s /
    4 s) make the long-horizon behaviour observable.  A one-step error at 250 Hz
    (4 ms of lookahead) is close to trivial and is NOT a conclusion by itself.
  selection_horizon: 25                      # protocol rule (validation only)
  start_indices: "pre-fixed per trajectory, integer arithmetic, no RNG"

metrics: configs/modeling_protocol.yaml      # identical metric list

model_matrix: configs/modeling_protocol.yaml # M0-M6 identical

control:
  mpc_N: 50                                  # 0.2 s at 250 Hz
  why_not_10: >-
    The soft platform used N = 10 = 2.0 s.  At 250 Hz that is only 40 ms, far
    shorter than the arm's dynamics; the horizon is therefore re-chosen, not reused.
  mpc_N_sensitivity: [25, 100]
  Q: identity(n_state)
  P_terminal: identity(n_state)
  R: 1e-3 * identity(n_ctrl)
  S: 1e-2 * identity(n_ctrl)
  u_ref: 0.0
  tail_fill: repeat
  solver: osqp
  u_limit_physical:                          # DEC-086 (user-confirmed 2026-10-11)
    lower: [-2.770553, -0.217663, -1.237823]
    upper: [3.678861, 5.994418, 3.113232]
  u_limit_normalised:
    lower: [-3.053656, -3.624193, -4.794951]
    upper: [3.967189, 3.138686, 3.172559]
  u_limit_source: >-
    train empirical range times a 1.05 multiplicative margin.  This is an
    ASSUMPTION, not an actuator rating: no authoritative torque limit exists in the
    project (the legacy clean_torque_data.m torque_limit = 10 is a cleaning default
    and the data never reaches it).  The box is asymmetric because joint 2's torque
    is dominated by gravity compensation (mean 3.11, near-zero crossing rate).
  scenarios:
    pos_channels: [0, 2, 4]                  # q1, q2, q3
    velocity_targets: 0                      # dq1, dq2, dq3 held at 0 in set points
    tracking_reference: "position channels follow the sinusoid; velocity channels use its analytic derivative"
    setpoint_steps: 400                      # 1.6 s
    tracking_steps: 800                      # 3.2 s
    periods: "slow = 400 steps (1.6 s), fast = 160 steps (0.64 s)"
    targets: "train-split quantiles only (no test leakage)"
    compute_bounded_choices:
      - "one control step costs ~66 ms at N=50 (nominal rollout dominates), so the scenario length is bounded rather than chosen for physical completeness"
      - "sensitivity study runs on a 2-scenario subset (setpoint_0 + slow_sinusoid) for every setting, including 'default', so the ranking comparison stays internally consistent"
      - "the MPC horizon (0.2 s) is FAR shorter relative to the arm's dynamics (dominant period 1.2-5 s) than the soft platform's N=10 (2 s vs the same 1.2-5 s). Matching the ratio would need N~500, i.e. ~0.7 s of wall time per control step. This is a disclosed limitation, not a matched design."

stage_policy:
  gate1_test_stage: >-
    the arm's test stage evaluates the checkpoints saved by the 'final' stage
    (--test-from-checkpoint) instead of retraining.  Neural training is not
    bit-reproducible on this machine, so a retrain would report numbers that do not
    correspond to the artifacts run_gate4/run_gate5 actually load.  The soft
    platform keeps the original retraining behaviour (flag defaults off).

plants: configs/control_protocol.yaml        # plant A = M3 (GRU), plant B = M6 (Transformer)

known_limitations:
  - "test split contains ONE trajectory: every test number has statistical unit 1"
  - "torque limit is an assumption (DEC-086), not an actuator rating"
  - "the arm dataset has no tracking reference; control scenarios are synthesised from train quantiles"
  - "offline closed-loop simulation only; no hardware experiment, no real-time claim"
  - "protocol step horizons and physical time are not interchangeable across devices"
